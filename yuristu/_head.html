<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Навигатор — разбор</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EBEEF1; --sunk:#E5E9ED;
  --line:#DBE0E5; --line-soft:#E8ECEF;
  --ink:#12171C; --ink-2:#3B444D; --ink-3:#59646F;
  --accent:#1D4A38; --accent-2:#2F6B52; --accent-soft:#DEE9E2;
  --crit:#A02A1B; --crit-soft:#FAE4E0;
  --warn:#87590F; --warn-soft:#F6EAD5;
  --ok:#1B6544; --ok-soft:#DDEFE4;
  --low:#54606B; --low-soft:#E6EAEE;
  --shadow:0 1px 2px rgba(18,23,28,.04), 0 12px 28px -20px rgba(18,23,28,.3);
  --f-disp:Georgia,Cambria,'PT Serif','Times New Roman',serif;
  --f-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1216; --surface:#151A20; --surface-2:#1C232A; --sunk:#11161B;
  --line:#2A323B; --line-soft:#212832;
  --ink:#E4E9EE; --ink-2:#A7B3BE; --ink-3:#7C8894;
  --accent:#6DBB96; --accent-2:#8CCFAE; --accent-soft:#16302B;
  --crit:#E5897A; --crit-soft:#381D18;
  --warn:#D3A459; --warn-soft:#332810;
  --ok:#6DBB96; --ok-soft:#13301F;
  --low:#8D99A5; --low-soft:#1E252D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#0E1216; --surface:#151A20; --surface-2:#1C232A; --sunk:#11161B;
  --line:#2A323B; --line-soft:#212832;
  --ink:#E4E9EE; --ink-2:#A7B3BE; --ink-3:#7C8894;
  --accent:#6DBB96; --accent-2:#8CCFAE; --accent-soft:#16302B;
  --crit:#E5897A; --crit-soft:#381D18;
  --warn:#D3A459; --warn-soft:#332810;
  --ok:#6DBB96; --ok-soft:#13301F;
  --low:#8D99A5; --low-soft:#1E252D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body);
  font-size:16px; line-height:1.62; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-disp); font-weight:400; margin:0; letter-spacing:-.015em; text-wrap:balance}
h1{font-size:clamp(30px,4.6vw,48px); line-height:1.08}
h2{font-size:clamp(23px,3vw,33px); line-height:1.16}
h3{font-size:19px; line-height:1.3}
h4{font-size:17px; line-height:1.3}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:3px}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-3)}
.dim{color:var(--ink-3); font-size:14px}
.lede{font-size:clamp(16.5px,1.9vw,19px); line-height:1.55; color:var(--ink-2)}

.wrap{max-width:1220px; margin:0 auto; padding-inline:clamp(18px,4vw,44px)}
.stack{display:flex; flex-direction:column; gap:clamp(16px,2.2vw,26px)}
.stack-s{display:flex; flex-direction:column; gap:11px}
.prose{max-width:70ch}

/* header */
.top{position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; gap:14px; padding-block:11px; flex-wrap:wrap}
.top b{font-family:var(--f-disp); font-weight:400; font-size:17px; margin-right:auto; letter-spacing:-.02em}
.filters{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.fbtn{font-family:var(--f-mono); font-size:11px; letter-spacing:.04em; padding:5px 11px; border-radius:100px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer;
  transition:background .14s,border-color .14s,color .14s}
.fbtn:hover{border-color:var(--ink-3)}
.fbtn[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.fbtn.crit[aria-pressed="true"]{background:var(--crit); border-color:var(--crit); color:#fff}
.fbtn.warn[aria-pressed="true"]{background:var(--warn); border-color:var(--warn); color:#fff}
.fbtn.low[aria-pressed="true"]{background:var(--low); border-color:var(--low); color:#fff}
#count{font-family:var(--f-mono); font-size:11px; color:var(--ink-3); white-space:nowrap}

/* layout */
.layout{display:grid; grid-template-columns:206px minmax(0,1fr); gap:clamp(24px,4vw,56px); align-items:start}
@media (max-width:940px){ .layout{grid-template-columns:1fr} .toc{display:none} }
.toc{position:sticky; top:64px; padding-block:34px}
.toc ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
.toc a{display:block; padding:5px 9px; border-radius:3px; text-decoration:none; color:var(--ink-3);
  font-size:13.5px; line-height:1.35; border-left:2px solid transparent}
.toc a:hover{color:var(--ink); background:var(--surface-2)}
.toc a.cur{color:var(--ink); border-left-color:var(--accent); background:var(--surface-2)}
main{padding-block:34px 90px; min-width:0}
section{padding-block:clamp(30px,4vw,52px); border-top:1px solid var(--line)}
section:first-of-type{border-top:0; padding-top:12px}
.snum{font-family:var(--f-mono); font-size:11px; color:var(--accent); letter-spacing:.1em}

/* findings */
.f{background:var(--surface); border:1px solid var(--line); border-left-width:3px; border-radius:3px;
  box-shadow:var(--shadow)}
.f summary{
  list-style:none; cursor:pointer; padding:15px 20px; display:flex; flex-direction:column; gap:7px;
  position:relative; padding-right:44px; border-radius:2px;
}
.f summary::-webkit-details-marker{display:none}
.f summary:hover{background:var(--surface-2)}
.f summary:focus-visible{outline:2px solid var(--accent-2); outline-offset:-2px}
.chev{
  position:absolute; right:18px; top:19px; width:9px; height:9px; border-right:1.6px solid var(--ink-3);
  border-bottom:1.6px solid var(--ink-3); transform:rotate(45deg); transition:transform .18s ease;
}
.f[open] .chev, details[open] .chev{transform:rotate(-135deg); top:23px}
.fbody{padding:0 20px 18px; display:flex; flex-direction:column; gap:9px; border-top:1px solid var(--line-soft); padding-top:14px; margin:0 0 0 0}
.f summary h3{margin:0}
.f[data-sev="crit"]{border-left-color:var(--crit)}
.f[data-sev="warn"]{border-left-color:var(--warn)}
.f[data-sev="low"]{border-left-color:var(--low)}
.f[hidden]{display:none}
.fhead{display:flex; gap:7px; align-items:center; flex-wrap:wrap}
.sev{font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  padding:3px 9px; border-radius:100px}
.sev.crit{background:var(--crit-soft); color:var(--crit)}
.sev.warn{background:var(--warn-soft); color:var(--warn)}
.sev.low{background:var(--low-soft); color:var(--low)}
.who{font-family:var(--f-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); padding:3px 0}
.where{border-left:2px solid var(--line); padding:2px 0 2px 12px; color:var(--ink-3); font-size:14px}
.where b{color:var(--ink-2); font-weight:600}
.f p{font-size:15px; color:var(--ink-2)}
.fix{background:var(--accent-soft); border-radius:3px; padding:11px 14px; font-size:14.5px; color:var(--ink)}
.fix b{color:var(--accent); font-weight:700}
.flist{display:flex; flex-direction:column; gap:12px}
.empty{padding:26px; text-align:center; color:var(--ink-3); font-size:15px;
  border:1px dashed var(--line); border-radius:3px}

/* good box */
.good{background:var(--ok-soft); border:1px solid var(--ok); border-left-width:3px; border-radius:3px; padding:18px 20px}
.good h4{color:var(--ink)}
.good ul{margin:10px 0 0; padding-left:19px; color:var(--ink-2); font-size:15px}
.good li{margin-bottom:6px}

/* tables */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:3px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:560px}
th,td{text-align:left; padding:11px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top}
th{font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); background:var(--surface-2); font-weight:400; white-space:nowrap}
tr:last-child td{border-bottom:0}
td b{font-weight:600}

/* callouts */
.note{border:1px solid var(--line); border-left:3px solid var(--accent); background:var(--surface);
  border-radius:3px; padding:16px 20px}
.note.red{border-left-color:var(--crit)}
.note.amb{border-left-color:var(--warn)}
.note h4{margin-bottom:7px}
.note p{color:var(--ink-2); font-size:15px}
.note p + p{margin-top:9px}

.chain{width:100%; height:auto; display:block; overflow:visible}
.chain text{font-family:var(--f-mono); font-size:10px; fill:var(--ink-3); letter-spacing:.04em}
.chain .lbl{font-family:var(--f-body); font-size:11.5px; fill:var(--ink-2); letter-spacing:0}
.chain .box{fill:var(--surface); stroke:var(--line)}
.chain .box.on{stroke:var(--accent); stroke-width:1.6}
.chain .box.off{stroke:var(--crit); stroke-dasharray:4 3}
.chain .ln{stroke:var(--accent); stroke-width:1.6; fill:none}
.chain .ln.brk{stroke:var(--crit); stroke-dasharray:5 4}

ol.num{counter-reset:n; list-style:none; margin:0; padding:0}
ol.num li{counter-increment:n; position:relative; padding:13px 0 13px 40px; border-bottom:1px solid var(--line-soft)}
ol.num li::before{content:counter(n,decimal-leading-zero); position:absolute; left:0; top:15px;
  font-family:var(--f-mono); font-size:11px; color:var(--accent)}
ol.num b{font-weight:600}
ol.num span{display:block; color:var(--ink-2); font-size:14.5px; margin-top:3px}

footer{border-top:1px solid var(--line); padding-block:28px 60px; color:var(--ink-3); font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
