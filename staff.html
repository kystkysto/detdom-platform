<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Навигатор — Кабинет сотрудника</title>
<style>
:root{
  color-scheme:light dark;
  --ground:#EEF2F4; --surface:#FFFFFF; --surface-2:#F6F9FA; --sunk:#E4EAEE;
  --line:#D4DDE2; --line-soft:#E5ECEF;
  --ink:#101A20; --ink-2:#3F515B; --ink-3:#5B6E77;
  --accent:#4C5FD7; --accent-2:#6B7BE8; --accent-soft:#E6E9FB; --accent-ink:#39479F;
  --amber:#8A5A12; --amber-soft:#F6EAD5;
  --good:#1F7A52; --good-soft:#DEF2E6;
  --warn:#8F5D10; --warn-soft:#F6EBD6;
  --crit:#9A3126; --crit-soft:#F6DFDB;
  --hero-a:#4C5FD7; --hero-b:#2B3690; --hero-ink:#F7F8FF; --hero-ink-2:#D2D8FA; --hero-eyebrow:#E9ECFD;
  --btn-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(16,26,32,.05), 0 10px 28px -16px rgba(16,26,32,.28);
  --shadow-lift:0 2px 4px rgba(16,26,32,.06), 0 18px 40px -20px rgba(16,26,32,.35);
  --r:10px; --r-lg:16px;
  --font-display:Georgia,'Iowan Old Style','Times New Roman',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D1317; --surface:#151E23; --surface-2:#1A252B; --sunk:#101A1F;
    --line:#2A383F; --line-soft:#212F36;
    --ink:#E3EAEE; --ink-2:#A6B9C2; --ink-3:#7C919D;
    --accent:#9AA6F5; --accent-2:#B4BDF9; --accent-soft:#262E60; --accent-ink:#C6CCFB;
    --amber:#D9A45E; --amber-soft:#34280F;
    --good:#5FC494; --good-soft:#163227;
    --warn:#CE9E52; --warn-soft:#332711;
    --crit:#DF8073; --crit-soft:#371C18;
    --hero-a:#3B49B8; --hero-b:#1D2568; --hero-ink:#F7F8FF; --hero-ink-2:#D2D8FA; --hero-eyebrow:#E9ECFD;
    --btn-ink:#141A45;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1317; --surface:#151E23; --surface-2:#1A252B; --sunk:#101A1F;
  --line:#2A383F; --line-soft:#212F36;
  --ink:#E3EAEE; --ink-2:#A6B9C2; --ink-3:#7C919D;
  --accent:#9AA6F5; --accent-2:#B4BDF9; --accent-soft:#262E60; --accent-ink:#C6CCFB;
  --amber:#D9A45E; --amber-soft:#34280F;
  --good:#5FC494; --good-soft:#163227;
  --warn:#CE9E52; --warn-soft:#332711;
  --crit:#DF8073; --crit-soft:#371C18;
  --hero-a:#3B49B8; --hero-b:#1D2568; --hero-ink:#F7F8FF; --hero-ink-2:#D2D8FA; --hero-eyebrow:#E9ECFD;
  --btn-ink:#141A45;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; letter-spacing:-.01em}
h1{font-size:clamp(22px,3.2vw,30px); line-height:1.2}
h2{font-size:19px; line-height:1.3}
h3{font-size:16px; line-height:1.35}
p{margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

.eyebrow{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3);
}

/* ---------- demo shell ---------- */
.appbar{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; padding:10px 20px;
}
.who{display:flex; align-items:center; gap:12px; margin-left:auto}
.who[hidden]{display:none}   /* display:flex иначе перебивает атрибут hidden */
.appbar #themeBtn{margin-left:auto}
.who ~ #themeBtn{margin-left:0}
.whoname{font-weight:600; font-size:14px}
.whorole{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:100px;
}
.shell.norail{grid-template-columns:minmax(0,1fr)}
.shell.norail .rail{display:none}
/* Экран входа — единственный, где нет рельса: центрируем по обеим осям */
.shell.norail .canvas{
  max-width:none; width:100%; min-height:calc(100vh - 57px);
  display:flex; align-items:center; justify-content:center;
  padding:40px 20px 60px;
}
.shell.norail .canvas > *{width:100%}
.demoacc{box-shadow:none; background:var(--surface-2)}
.demoacc summary{cursor:pointer; font-size:13px; color:var(--ink-3); list-style:none}
.demoacc summary::-webkit-details-marker{display:none}
.demoacc summary::before{content:"▸ "}
.demoacc[open] summary::before{content:"▾ "}
.acclist{margin:6px 0 0; padding-left:18px; font-size:13.5px; color:var(--ink-2)}
.acclist li{margin-bottom:3px}
.brand{display:flex; align-items:baseline; gap:9px}
.brand b{font-family:var(--font-display); font-size:17px; font-weight:600; letter-spacing:-.01em}
.brand .tag{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent); background:var(--accent-soft); padding:2px 7px; border-radius:100px;
}
.roles{display:flex; gap:2px; background:var(--sunk); padding:3px; border-radius:100px;
  flex-wrap:nowrap; overflow-x:auto; max-width:100%; scrollbar-width:none}
.roles::-webkit-scrollbar{display:none}
.roles button{white-space:nowrap}
.roles button{
  border:0; background:transparent; padding:5px 13px; border-radius:100px;
  font-size:13px; color:var(--ink-2); cursor:pointer; transition:background .15s,color .15s;
}
.roles button:hover{color:var(--ink)}
.roles button[aria-pressed="true"]{background:var(--surface); color:var(--accent); box-shadow:var(--shadow); font-weight:600}
.toolbtn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  padding:5px 11px; border-radius:100px; font-size:12px; cursor:pointer; white-space:nowrap;
  display:inline-flex; align-items:center; gap:7px; transition:border-color .15s,color .15s;
}
.toolbtn:hover{border-color:var(--accent); color:var(--accent)}
.toolbtn[aria-pressed="true"]{background:var(--amber-soft); border-color:var(--amber); color:var(--amber); font-weight:600}


.shell{display:grid; grid-template-columns:264px minmax(0,1fr); gap:0; align-items:start}
.rail{
  position:sticky; top:57px; align-self:start; padding:22px 16px 40px; min-width:0;
  border-right:1px solid var(--line); min-height:calc(100vh - 57px);
}
.rail h4{margin:0 0 10px 4px; font:inherit}
.railgroup + .railgroup{margin-top:22px}
.steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px; min-width:0}
.steps button{
  width:100%; text-align:left; border:0; background:transparent; cursor:pointer;
  display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:8px;
  font-size:13.5px; color:var(--ink-2); transition:background .12s,color .12s;
}
.steps button:hover{background:var(--surface); color:var(--ink)}
.steps button[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.num{
  flex:0 0 20px; height:20px; border-radius:100px; display:grid; place-items:center;
  font-family:var(--font-mono); font-size:10.5px; background:var(--sunk); color:var(--ink-2);
}
.steps button[aria-current="true"] .num{background:var(--accent); color:var(--btn-ink)}
.num.done{background:var(--good-soft); color:var(--good)}
.dot{flex:0 0 20px; display:grid; place-items:center; color:var(--ink-3); font-size:11px}

.canvas{padding:26px 30px 80px; max-width:1000px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static; min-height:0; border-right:0; border-bottom:1px solid var(--line); padding:14px 16px}
  .steps{flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:4px; scrollbar-width:thin}
  .steps button{white-space:nowrap; width:auto}
  .canvas{padding:20px 16px 60px}
}

/* ---------- primitives ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow)}
.pad{padding:22px 24px}
.stack{display:flex; flex-direction:column; gap:18px}
.stack-sm{display:flex; flex-direction:column; gap:10px}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3); font-size:13px}
.hr{height:1px; background:var(--line-soft); border:0; margin:0}

.btn{
  border:0; background:var(--accent); color:var(--btn-ink); padding:10px 18px; border-radius:var(--r);
  font-size:14px; font-weight:600; cursor:pointer; transition:transform .1s, filter .15s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.btn.ghost{color:var(--accent)}

.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:100px;
  font-size:11.5px; font-weight:600; background:var(--sunk); color:var(--ink-2); white-space:nowrap;
}
.pill.acc{background:var(--accent-soft); color:var(--accent-ink)}
.pill.good{background:var(--good-soft); color:var(--good)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.crit{background:var(--crit-soft); color:var(--crit)}
.pill.amb{background:var(--amber-soft); color:var(--amber)}

input[type="text"],input[type="password"],select,textarea{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface-2); color:var(--ink); font:inherit;
}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
label.field{display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--ink-2)}

.bar{height:6px; background:var(--sunk); border-radius:100px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:100px; transition:width .35s ease}
.bar.amb i{background:var(--amber)}

table{width:100%; border-collapse:collapse; font-size:13.5px}
th{
  text-align:left; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500; padding:0 12px 8px; border-bottom:1px solid var(--line);
}
td{padding:11px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
tr:last-child td{border-bottom:0}
.tnum{font-variant-numeric:tabular-nums; font-family:var(--font-mono); font-size:12.5px}
.scroller{overflow-x:auto}

.choice{
  display:flex; gap:11px; align-items:flex-start; padding:12px 14px; border:1px solid var(--line);
  border-radius:var(--r); background:var(--surface-2); cursor:pointer; transition:border-color .12s,background .12s;
}
.choice:hover{border-color:var(--accent-2)}
.choice[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.choice .mark{
  flex:0 0 18px; height:18px; margin-top:1px; border-radius:100px; border:1.5px solid var(--line);
  display:grid; place-items:center; background:var(--surface);
}
.choice[aria-pressed="true"] .mark{border-color:var(--accent); background:var(--accent)}
.choice[aria-pressed="true"] .mark::after{content:''; width:7px; height:7px; border-radius:100px; background:var(--surface)}
.choice span{text-align:left}

.likert{display:flex; gap:6px; flex-wrap:wrap}
.likert button{
  border:1px solid var(--line); background:var(--surface-2); border-radius:100px;
  padding:6px 14px; font-size:12.5px; cursor:pointer; color:var(--ink-2); transition:all .12s;
}
.likert button:hover{border-color:var(--accent-2); color:var(--ink)}
.likert button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--btn-ink); font-weight:600}

/* design notes */
.note{display:none}
body.notes-on .note{
  display:flex; gap:9px; align-items:flex-start;
  background:var(--amber-soft); border-left:3px solid var(--amber);
  border-radius:0 var(--r) var(--r) 0; padding:9px 13px; font-size:12.5px; color:var(--amber);
}
body.notes-on .note b{font-weight:700; white-space:nowrap; flex:0 0 auto}

/* ---- возрастной регистр 12–14 ----
   Крупнее набор, больше воздуха, крупнее цели нажатия. Не «детский» вид:
   подросток 13 лет закроет всё, что выглядит как для малышей. */
.agesw{display:inline-flex; border:1px solid var(--line); border-radius:100px; overflow:hidden}
.agesw .toolbtn{border:0; border-radius:0; padding:5px 11px}
.agesw .toolbtn + .toolbtn{border-left:1px solid var(--line)}
.agesw .toolbtn[aria-pressed="true"]{background:var(--accent); color:var(--btn-ink)}
body.young{font-size:17.5px; line-height:1.68}
body.young h1{font-size:clamp(30px,4.4vw,44px)}
body.young h2{font-size:clamp(22px,2.8vw,29px)}
body.young h3{font-size:19px}
body.young .btn{padding:15px 24px; font-size:16.5px}
body.young .choice, body.young .likert button{padding:16px 18px; font-size:16.5px}
body.young .stack{gap:20px}
body.young .card{padding:24px 26px}
body.young .muted, body.young .card p{font-size:16px}
body.young .dim{font-size:14.5px}

.hero{
  background:linear-gradient(160deg,var(--hero-a) 0%,var(--hero-b) 100%);
  color:var(--hero-ink-2); border-radius:var(--r-lg); padding:26px 28px; box-shadow:var(--shadow-lift);
}
.hero h1{color:var(--hero-ink)}
.hero .eyebrow{color:var(--hero-eyebrow)}
.hero p{color:var(--hero-ink-2)}

.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.tile .k{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.tile .v{font-family:var(--font-display); font-size:26px; font-variant-numeric:tabular-nums; margin-top:4px}

.cert{
  border:2px solid var(--accent); border-radius:var(--r-lg); padding:30px 32px;
  background:var(--surface); box-shadow:var(--shadow-lift); position:relative; overflow:hidden;
}
.cert::before{
  content:''; position:absolute; inset:8px; border:1px solid var(--accent-soft); border-radius:10px; pointer-events:none;
}
.cert .name{font-family:var(--font-display); font-size:28px; margin:14px 0 6px}

.lessonbody{font-size:15px; line-height:1.7; color:var(--ink-2)}
.lessonbody p + p{margin-top:12px}
.videobox{
  aspect-ratio:16/9; background:var(--sunk); border-radius:var(--r); display:grid; place-items:center;
  color:var(--ink-3); text-align:center; border:1px dashed var(--line); gap:6px; padding:20px;
}
.seg{display:inline-flex; background:var(--sunk); border-radius:100px; padding:3px}
.seg button{border:0; background:transparent; padding:5px 14px; border-radius:100px; font-size:12.5px; cursor:pointer; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--accent); font-weight:600; box-shadow:var(--shadow)}

.locked{
  background:var(--crit-soft); border:1px dashed var(--crit); color:var(--crit);
  border-radius:var(--r); padding:12px 14px; font-size:13px;
}
</style>

<header class="appbar">
  <div class="brand"><b>Навигатор</b><span class="tag">сотрудник</span></div>
  <div class="who" id="who" hidden>
    <span class="whoname" id="whoName"></span>
    <span class="whorole" id="whoRole"></span>
    <button class="toolbtn" data-act="logout">Выйти</button>
  </div>
  <button class="toolbtn" id="themeBtn">Тёмная тема</button>
</header>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="canvas" id="canvas"></main>
</div>

<script>
"use strict";

/* ============ данные ============ */
const ROLES = [
  {id:"child",   label:"Ребёнок"},
  {id:"curator", label:"Куратор"},

const TRACKS = {

const PSY_ITEMS = [
  {t:"Мне легко начать разговор с новым человеком", k:"people"},

  {t:"Я часто что-то рисую, снимаю или придумываю", k:"image"},
  {t:"Мне важно, как вещь выглядит, а не только работает", k:"image"},
  {t:"Я могу долго подбирать цвет, кадр или музыку", k:"image"},
  {t:"Мне спокойно рядом с растениями или животными", k:"nature"},
  {t:"Я готов ухаживать за чем-то живым каждый день", k:"nature"},
  {t:"Мне интересно, почему растение болеет", k:"nature"}
];
const LIKERT = [
  {v:0, t:"Не про меня"},
  {v:1, t:"Иногда"},
  {v:2, t:"Часто"},
  {v:3, t:"Точно про меня"}
];

const COURSES = [
  {id:"c1", title:"Первый ремонт: инструмент и безопасность", track:"tech", level:"С нуля", age:"14+", hours:12, lessons:9, partner:"Колледж-партнёр, волонтёры", supervised:true},

function scores(){
  const acc = {people:0,tech:0,sign:0,image:0,nature:0};
  PSY_ITEMS.forEach((it,i)=>{ if(S.psy[i]!=null) acc[it.k]+=S.psy[i]; });
  Object.keys(S.quick).forEach(i=>{ const k = QUICK[i].a[S.quick[i]].k; acc[k]+=2; });
  return acc;
}
function ranked(){
  const a = scores();
  return Object.keys(a).map(k=>({k, v:a[k]})).sort((x,y)=>y.v-x.v);
}
function isTie(){
  const r = ranked();
  return r.length > 1 && r[0].v === r[1].v;
}
function leaders(){
  const r = ranked();
  return r.filter(x => x.v === r[0].v);
}
function topTrack(){ return ranked()[0].k; }
function coursesFor(k){
  const mine = COURSES.filter(c=>c.track===k);
  const must = COURSES.filter(c=>c.id==="c9");
  return mine.concat(must.filter(c=>!mine.includes(c)));
}

function renderRail(){
  let html = "";
  if(S.role==="child"){
    html += `<div class="railgroup"><div class="eyebrow" style="margin:0 0 9px 4px">Путь ребёнка</div><ul class="steps">`;
    journeySteps().forEach((j,i)=>{
      const id = j[0], d = doneOf(id);
      html += `<li><button data-screen="${id}" aria-current="${S.screen===id}">
        <span class="num ${d?"done":""}">${d?"✓":i+1}</span><span>${esc(jlabel(j))}</span></button></li>`;
    });

  } else {
    const list = OTHER[S.role];
    html += `<div class="railgroup"><div class="eyebrow" style="margin:0 0 9px 4px">Рабочее место</div><ul class="steps">`;

      html += `<li><button data-screen="${id}" aria-current="${S.screen===id}">
        <span class="dot">▪</span><span>${esc(label)}</span></button></li>`;
    });
    html += `</ul></div>`;
  }
  const railEl = document.getElementById("rail");
  railEl.innerHTML = S.loggedIn ? html : "";
  railEl.hidden = !S.loggedIn;

      <div class="card pad"><div class="grid2">

      </div>
      <hr class="hr" style="margin:16px 0">
      <p class="dim">Возраст и учреждение мы не спрашивали — они уже привязаны к твоему ключу доступа.</p>
      ${note("Минимизация данных + этика","В ТЗ анкета спрашивает возраст и учреждение заново. Это лишний сбор ПДн и лишний экран в воронке, а главное — ребёнка заставляют вручную выбрать название своего детского дома на первом же экране знакомства.")}

        ${note("Усиление №6","Ответ про устройство и канал напрямую меняет формат выдачи контента. В ТЗ такой связи нет: там видео — основной формат.")}

        <select data-act="anketaField" data-k="${f.k}">
          <option value="">— выбери —</option>
          ${f.opts.map(o=>`<option ${S.anketa[f.k]===o?"selected":""}>${esc(o)}</option>`).join("")}
        </select></label>`).join("")}
    </div></div>
    <div class="row">
      ${S.anketaStep>0?`<button class="btn ghost" data-act="anketaBack">Назад</button>`:""}
      <button class="btn" data-act="anketaNext" ${st.fields.every(f=>S.anketa[f.k])?"":"disabled"}>
        ${S.anketaStep===anketaSteps().length-1?"Готово":"Дальше"}</button>
      <span class="dim">Можно закрыть и вернуться — ответы сохраняются</span>
    </div>
    ${note("Раздел 5 ТЗ + крайний случай","Прогресс сохраняется после каждого шага. Отдельно: если анкета брошена на середине, профиль помечается неполным и рекомендации не выдаются как окончательные.")}
  </div>`;
};

V.psytest = () => {

  if(S.psyDone) return `<div class="stack">
    <div class="eyebrow">Шаг 4 · Склонности</div>
    <h1>Вопросы пройдены</h1>
    <div class="card pad">
      <div class="pill good">Готово</div>
      <p style="margin-top:10px">Ответы записаны. Результат — на следующем шаге, в профиле.</p>
      <div class="row" style="margin-top:14px">
        <button class="btn" data-screen="profile">Открыть профиль</button>
        <button class="btn ghost" data-act="psyReset">Пройти заново</button>
      </div>
    </div>
  </div>`;
  return `<div class="stack">
    <div class="eyebrow">Шаг 4 · Склонности</div>
    <h1>Что про тебя правда, а что нет</h1>
    <p class="muted" style="max-width:60ch">${A("Это не контрольная. Плохих ответов тут нет. Твои ответы видит только психолог — больше никто. Есть одно исключение, и мы говорим о нём сразу: если он поймёт, что тебе угрожает опасность, он позовёт взрослых, которые помогут. И сначала скажет об этом тебе.","Это не экзамен и не проверка «нормальный ты или нет». Здесь нет плохих ответов. Твои ответы видит только психолог проекта — с одним исключением: если он поймёт, что тебе угрожает опасность, он обязан подключить взрослых, которые помогут, и сначала скажет об этом тебе.")}</p>
    <div class="card pad" style="border-color:var(--crit)">
      <div class="pill crit">Важно для заказчика</div>
      <p style="margin-top:9px">Утверждения ниже — <b>демонстрационные</b>. Это не валидизированная методика и не психологическая диагностика. Реальный набор должен быть либо лицензирован у правообладателя, либо собран психологом-методологом с последующей валидацией.</p>
      ${note("Вопрос 3 заказчику","Раздел 6 ТЗ говорит что мерить, но не говорит чем. Пока это не решено, любой тест на платформе — макет, а не инструмент.")}
    </div>
    <div class="bar"><i style="width:${Math.round(answered/PSY_ITEMS.length*100)}%"></i></div>
    ${PSY_ITEMS.map((it,i)=>`
      <div class="card pad" style="padding:16px 20px">
        <div style="margin-bottom:10px">${esc(it.t)}</div>
        <div class="likert">
          ${LIKERT.map(l=>`<button data-act="psy" data-i="${i}" data-v="${l.v}"

      </div>`).join("")}
    <div class="row">
      <button class="btn" data-act="psyDone" ${answered<PSY_ITEMS.length?"disabled":""}>Посмотреть результат</button>
      <span class="dim">${answered} из ${PSY_ITEMS.length}</span>
    </div>
  </div>`;
};

V.profile = () => {
  if(!S.psyDone) return `<div class="stack"><h1>Профиль пока пуст</h1>
    <p class="muted">Сначала пройди короткий разговор и вопросы про склонности.</p>
    <div class="row"><button class="btn" data-screen="insight">Начать</button></div></div>`;
  const r = ranked(); const max = Math.max(...r.map(x=>x.v), 1);
  const top = r[0].k;
  const recs = coursesFor(top);
  return `<div class="stack">
    <div class="eyebrow">Шаг 5 · Твой профиль</div>
    <h1>${esc(S.name)}, вот что получилось</h1>
    <div class="card pad">
      <h3>${A("Что тебе ближе","Твои сильные стороны")}</h3>
      <div class="stack-sm" style="margin-top:14px">
        ${r.slice(0,3).map(x=>`<div>
          <div style="margin-bottom:5px">${esc(TRACKS[x.k].name)} <span class="dim">— ${esc(TRACKS[x.k].blurb)}</span></div>
          <div class="bar ${x.k===top?"":"amb"}"><i style="width:${Math.round(x.v/max*100)}%"></i></div>
        </div>`).join("")}
      </div>
      <hr class="hr" style="margin:18px 0">
      <p class="dim">${A("Остальное мы почти не спрашивали. Это не значит, что не получится.","Остальное мы ещё почти не проверяли — это не про то, что у тебя не получится.")}</p>
      <p class="muted" style="margin-top:10px">${A("Это не приговор. Это просто подсказка, с чего начать. Не понравится — попробуешь другое, так можно.","Это не приговор и не диагноз. Это подсказка, с чего начать пробовать. Если не понравится — поменяешь направление, это нормально.")}</p>
      ${note("Раздел 6 ТЗ + этика","Формулировки не медицинские: «сильные стороны», а не «диагностика личности». Баллы ребёнку не показываем — цифру «3» он прочтёт как тройку в дневнике; и показываем только верхние направления, а не ранжир слабостей.")}
    </div>
    <div class="card pad">
      <div class="pill acc">Кто это видит</div>
      <p style="margin-top:10px">${A("Твои ответы видит только психолог. Остальные взрослые видят, какое занятие ты выбрал и как идёшь — и всё.","Твои ответы видит только психолог проекта. Преподаватель, куратор и воспитатель видят лишь то, какой курс ты выбрал и как идёшь по нему.")}</p>
      <p class="muted" style="margin-top:10px">Есть одно исключение, и мы говорим о нём заранее: если психолог поймёт, что тебе угрожает опасность, он обязан подключить взрослых, которые могут помочь. В этом случае он сначала скажет об этом тебе.</p>
      ${note("Инвариант проекта + честность","Обещать ребёнку абсолютную тайну нельзя: при признаках угрозы взрослые обязаны реагировать. Согласие должно быть информированным, поэтому исключение названо прямо и заранее, а не вскрывается в худший момент.")}
    </div>
    <h2>Что тебе стоит попробовать</h2>
    <div class="grid2">
      ${recs.map(c=>`<div class="card pad" style="box-shadow:none">
        <div class="row" style="gap:6px"><span class="pill acc">${esc(TRACKS[c.track].name)}</span>
        <span class="pill">${esc(c.age)}</span>
        ${c.id==="c9"?`<span class="pill amb">Пригодится всем</span>`:""}</div>
        <h3 style="margin-top:10px">${esc(c.title)}</h3>
        <p class="dim" style="margin-top:6px">${esc(c.level)} · ${c.hours} ч · ${c.lessons} уроков</p>
        <button class="btn ghost" data-act="pick" data-c="${c.id}" style="margin-top:12px">Открыть курс</button>
      </div>`).join("")}
    </div>
    <div class="row"><button class="btn ghost" data-screen="catalog">Посмотреть весь каталог</button></div>
  </div>`;

V.catalog = () => {
  const top = S.psyDone ? topTrack() : null;
  // Возрастная фильтрация: 16+ младшим не показывается вовсе — не «серым»,
  // сама видимость такой карточки создаёт вопрос у опеки.
  const list = COURSES.filter(c => !(young() && c.age === "16+"));
  const hidden = COURSES.length - list.length;
  return `<div class="stack">
    <div class="eyebrow">Шаг 6 · ${A("Что можно попробовать","Каталог")}</div>
    <h1>${A("Выбери, что попробовать","Курсы")}</h1>
    ${top?`<p class="muted">${A("Сверху — то, что тебе ближе. Но открыть можно любое.","Сначала — то, что подходит тебе по профилю. Остальное тоже открыто: пробовать можно что угодно.")}</p>`:""}
    ${young()?`<p class="muted">Начать можно с одного занятия. Оно короткое — если не пойдёт, просто возьмёшь другое.</p>`:""}
    <div class="grid2">
      ${list.slice().sort((a,b)=>((b.track===top)-(a.track===top))).map(c=>`
        <div class="card pad" style="box-shadow:none">
          <div class="row" style="gap:6px">
            <span class="pill ${c.track===top?"acc":""}">${esc(TRACKS[c.track].name)}</span>

            ${c.track===top?`<span class="pill good">Тебе подходит</span>`:""}

          </div>
          <h3 style="margin-top:10px">${esc(c.title)}</h3>
          <p class="dim" style="margin-top:6px">${young()
            ? `Первое занятие — минут 15`
            : `${esc(c.level)} · ${c.hours} ч · ${c.lessons} уроков`}</p>
          ${young()?"":`<p class="dim" style="margin-top:3px">Партнёр: ${esc(c.partner)}</p>`}
          ${c.supervised?`<p class="dim" style="margin-top:3px">Практика — только вместе со взрослым</p>`:""}
          <button class="btn ghost" data-act="pick" data-c="${c.id}" style="margin-top:12px">${A("Попробовать","Открыть")}</button>
        </div>`).join("")}
    </div>
    ${note("Вопрос 6 заказчику","Каталог заполнен партнёрскими курсами, а не собственным продакшном. В ТЗ вопрос «откуда контент» не поднят вообще — а это часто дороже самой разработки.")}
    ${note("436-ФЗ","Возрастная маркировка проставляется при загрузке курса, а не после. Курс без неё и без текстовой версии уроков не публикуется.")}
    ${hidden?note("436-ФЗ · фильтрация","В регистре 12–14 курсы с маркировкой 16+ не отображаются вовсе. Скрыто карточек: "+hidden+". Возраст берётся из записи ключа, а не спрашивается у ребёнка."):""}
    <p class="dim">Полные уроки с видео с Rutube развёрнуты в курсах «Взрослая жизнь: документы, жильё, деньги» и «Первый ремонт». Остальные карточки показывают формат каталога.</p>
  </div>`;
};

V.lesson = () => {
  const c = courseById(S.course) || COURSES[0];
  const text = S.lessonMode === "text";
  const isMoney = c.id === "c9";
  const isRepair = c.id === "c1";
  const isReal = isMoney || isRepair;
  const videoSrc = isMoney
    ? "https://rutube.ru/play/embed/f88a988f0c9edeb963bb68baa9c50698/"
    : "https://rutube.ru/play/embed/122a37cabf763e345d597d84c5e5878b/";
  const lessonTitle = isMoney
    ? "Первые деньги, подработка и как не попасть на развод с картой"
    : (isRepair ? "Отвёртка, бита и первый саморез" : "Пример урока");

  return `<div class="stack">
    <div class="eyebrow">Шаг 7 · ${esc(c.title)} · урок ${isMoney?1:3} из ${c.lessons}</div>
    <h1>${lessonTitle}</h1>
    ${!isReal ? `<div class="locked">
      Полные уроки с видео развёрнуты в курсах <b>«Взрослая жизнь: документы, жильё, деньги»</b> и <b>«Первый ремонт: инструмент и безопасность»</b>.
      Остальные курсы показаны витриной.
      <br><br><b>Чтобы посмотреть согласованную связку курс → урок → аттестация → сертификат,
      вернитесь в каталог и откройте «Взрослая жизнь» или «Первый ремонт».</b>
    </div>` : ""}
    <div class="row" style="justify-content:space-between">
      <div class="seg">
        <button data-act="mode" data-m="text" aria-pressed="${text}">Текстом</button>
        <button data-act="mode" data-m="video" aria-pressed="${!text}">Видео</button>
      </div>
      <span class="pill ${text?"good":"warn"}">${text?"~200 КБ, откроется на любом канале":"Rutube плеер (без авторизации)"}</span>
    </div>
    <div class="card pad">
      ${text ? (isMoney ? `<div class="lessonbody">
        <p><b>1. «Сдай карту в аренду за 5 000 ₽» — это ловушка (дропперство).</b> Если знакомый или человек в мессенджере просит оформить карту на твоё имя или пропустить через твою карту чужой перевод за процент — через неё выводят краденые деньги. По закону (ст. 159 и 187 УК РФ) полиция приходит к владельцу карты, а банки блокируют все твои счета по 115-ФЗ вместе с подъёмными выплатами.</p>
        <p><b>2. Первая подработка: только с договором или через «Мой налог».</b> Честная подработка в 16–18 лет (курьер, склад, сборка заказов, кафе) оформляется трудовым договором, договором ГПХ или через официальное приложение самозанятого «Мой налог». Если обещают «золотые горы без оформления» или просят сначала заплатить за обучение/форму — это обман.</p>
        <p><b>3. «Безопасных счетов» не существует.</b> Ни банк, ни опека, ни полиция никогда не звонят с просьбой назвать код из СМС или перевести выплаты на «защищённый счёт». Услышал про код или перевод — сразу клади трубку.</p>
        <p><b>4. Правило одного звонка.</b> Прежде чем подписать любую бумагу про деньги, кредит, доверенность или жильё — сначала позвони куратору или юристу фонда и покажи фото документа.</p>
      </div>` : `<div class="lessonbody">
        <p>Отвёртка держится не пальцами, а всей ладонью: усилие идёт вдоль оси, а не вбок. Если давить вбок, бита срывается и облизывает шлиц — саморез после этого выкрутить уже трудно.</p>
        <p>Бита подбирается по шлицу, а не «примерно подходит». PH2 — самый частый размер для бытовых саморезов; PH1 в таком шлице будет болтаться и сорвёт крестовину с первого нажима.</p>
        <p>Первый оборот делается медленно и с нажимом — саморез должен «поймать» материал. Дальше нажим уменьшают, иначе шляпка утонет и в гипсокартоне просто провернётся впустую.</p>
        <p>В гипсокартон без дюбеля можно вешать только лёгкое: крючок, кабель-канал. Полка с книгами сорвёт саморез вместе с куском стены — для неё нужен дюбель-бабочка или попадание в профиль.</p>
      </div>`) : `<div style="position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:var(--r); background:#000">
        <iframe src="${videoSrc}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0" allow="clipboard-write; autoplay; fullscreen" allowfullscreen></iframe>
      </div>`}
    </div>
    <div class="card pad">
      <div class="eyebrow">Домашнее задание</div>
      <h3 style="margin-top:6px">${isMoney ? "Разбери ситуацию: знакомый просит перевести 20 000 ₽ через твою карту за 2 000 ₽" : "Закрути два самореза: один в дерево, один в гипсокартон с дюбелем"}</h3>
      <p class="muted" style="margin-top:6px">${isMoney ? "Напиши коротко, почему соглашаться нельзя и что грозит владельцу карты. Проверит преподаватель, ответ придёт в течение суток." : "Практические задания выполняются только вместе со взрослым. Сфотографируй результат и напиши, что было сложнее. Проверит преподаватель, ответ придёт в течение суток."}</p>
      ${S.hwSent
        ? `<div class="row" style="margin-top:14px"><span class="pill good">Отправлено</span><span class="dim">Ждём проверку преподавателя</span></div>`
        : `<div class="stack-sm" style="margin-top:14px">
            <textarea rows="3" placeholder="${isMoney ? "Напиши свой ответ..." : "Что получилось, что было сложно"}" aria-label="Ответ на задание"></textarea>
            ${S.photo?`<div class="row"><span class="pill good">фото прикреплено</span><span class="dim">макет вложения</span></div>`:""}
            <div class="row"><button class="btn" data-act="hw">Отправить на проверку</button>
            ${isMoney?"":`<button class="btn ghost" data-act="hwPhoto">Прикрепить фото</button>`}</div>
          </div>`}
    </div>
    <div class="row"><button class="btn" data-screen="attestation">Перейти к аттестации</button></div>
  </div>`;
};

V.attestation = () => {

  if(S.attestDone){
    const ok = S.attestScore>=3;
    return `<div class="stack">
      <div class="eyebrow">Шаг 8 · ${A("Проверь себя","Аттестация")}</div>
      <h1>${ok?"Сдано":"Пока не сдано"}</h1>
      <div class="card pad" style="border-color:${ok?"var(--good)":"var(--warn)"}">
        <div class="row" style="gap:10px">
          <span class="pill ${ok?"good":"warn"}">${S.attestScore} из ${getAttest().length}</span>
          <span class="muted">${ok?"Проходной балл — 3. Сертификат доступен." : "Нужно минимум 3. Пересдача открыта сразу, попытки не ограничены."}</span>
        </div>
        <div class="stack-sm" style="margin-top:16px">
          ${getAttest().map((q,i)=>{
            const right = S.attest[i]===q.right;
            return `<div class="row" style="align-items:flex-start; gap:9px">

function qrSvg(seed){
  const N=25; let h=0; for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
  let rects="";
  const on=(x,y)=>{ h=(h*1103515245+12345)>>>0; return ((h>>>16)&1)===1; };
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const finder = (x<7&&y<7)||(x>N-8&&y<7)||(x<7&&y>N-8);
    const fdraw = finder && !((x>1&&x<5&&y>1&&y<5)||(x>N-6&&x<N-2&&y>1&&y<5)||(x>1&&x<5&&y>N-6&&y<N-2))
      ? ((x===0||x===6||y===0||y===6)||(x>N-8&&(x===N-7||x===N-1||y===0||y===6))||(y>N-8&&(y===N-7||y===N-1||x===0||x===6)))
      : false;
    const solid = finder ? (fdraw || (x>1&&x<5&&y>1&&y<5)||(x>N-6&&x<N-2&&y>1&&y<5)||(x>1&&x<5&&y>N-6&&y<N-2)) : on(x,y);
    if(solid) rects+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 ${N} ${N}" width="104" height="104" role="img" aria-label="Демонстрационный код проверки" style="shape-rendering:crispEdges; fill:var(--ink)">${rects}</svg>`;
}

/* ============ роутер ============ */
let gateMsg = null;
function focusKey(el){
  if(!el || !el.dataset || !el.dataset.act) return null;
  const d = el.dataset;
  return `[data-act="${d.act}"]` +
    (d.i!=null?`[data-i="${d.i}"]`:"") + (d.q!=null?`[data-q="${d.q}"]`:"") +
    (d.a!=null?`[data-a="${d.a}"]`:"") + (d.v!=null?`[data-v="${d.v}"]`:"") +
    (d.m!=null?`[data-m="${d.m}"]`:"") + (d.w!=null?`[data-w="${d.w}"]`:"") +
    (d.k!=null?`[data-k="${d.k}"]`:"") + (d.c!=null?`[data-c="${d.c}"]`:"");
}
function render(){
  if(S.role !== "child" && !OTHER[S.role]) S.role = "child";
  if(!S.loggedIn && S.screen !== "login"){
    const step = JOURNEY_ALL.find(j => j[0] === S.screen);
    gateMsg = step ? jlabel(step) : null;
    S.screen = "login";
  }
  const canvas = document.getElementById("canvas");
  const rail = document.getElementById("rail");
  const active = document.activeElement;
  const keep = canvas.contains(active) ? focusKey(active) : null;
  const keepRail = rail.contains(active) && active.dataset && active.dataset.screen
    ? `[data-screen="${active.dataset.screen}"]` : null;
  const fn = V[S.screen] || V.login;
  canvas.innerHTML = fn();
  gateMsg = null;
  if(keep){ const back = canvas.querySelector(keep); if(back) back.focus({preventScroll:true}); }
  renderRail();
  if(keepRail){ const b = rail.querySelector(keepRail); if(b) b.focus({preventScroll:true}); }
  const who = document.getElementById("who");
  who.hidden = !S.loggedIn;
  if(S.loggedIn){
    document.getElementById("whoName").textContent = S.name;
    document.getElementById("whoRole").textContent = S.roleTitle || "";
  }
  document.documentElement.setAttribute("data-theme", S.theme);
  document.getElementById("themeBtn").textContent =
    S.theme === "dark" ? "Светлая тема" : "Тёмная тема";
  document.body.classList.toggle("young", young() && S.role === "child");
  save();
}
function go(screen){ S.screen = screen; window.scrollTo({top:0,behavior:"instant"}); render(); }

/* ============ события ============ */
document.addEventListener("click", e => {
  const scr = e.target.closest("[data-screen]");
  if(scr) return go(scr.dataset.screen);

  const el = e.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act;

  if(a==="login"){
    const key = (document.getElementById("keyInput").value||"").trim().toUpperCase();
    const nm = (document.getElementById("nameInput").value||"").trim();
    const rec = KEYS.find(k => k.key.toUpperCase() === key);
    const err = document.getElementById("keyErr");
    if(!rec){
      err.innerHTML = `<div class="locked">Такого ключа нет в реестре. Ключ выдаёт куратор вместе с оформленным согласием.</div>`;
      return;
    }
    if(rec.status === "заблокирован"){
      err.innerHTML = `<div class="locked">Ключ заблокирован: к нему не приложен документ-основание. Обратись к куратору — без согласия законного представителя доступ не открывается.</div>`;
      return;
    }
    S.loggedIn = true; S.role = "child"; S.roleTitle = "Ученик";
    S.org = rec.org; S.ageBand = rec.age;
    if(nm) S.name = nm;
    return go(rec.age === "grad" ? "aftergrad" : "insight");
  }
  if(a==="logout"){
    const keepTheme = S.theme;
    S = JSON.parse(JSON.stringify(BLANK));
    S.theme = keepTheme;
    return go("login");
  }
  if(a==="quick"){ S.quick[el.dataset.q]=+el.dataset.a; return render(); }
  if(a==="quickDone"){ S.quickDone=true; return render(); }
  if(a==="quickReset"){ S.quick={}; S.quickDone=false; return render(); }
  if(a==="anketaField"){ return; }
  if(a==="anketaNext"){
    if(S.anketaStep===anketaSteps().length-1){ S.anketaDone=true; } else { S.anketaStep++; }
    return render();
  }
  if(a==="anketaBack"){ S.anketaStep=Math.max(0,S.anketaStep-1); return render(); }
  if(a==="anketaReset"){ S.anketa={}; S.anketaStep=0; S.anketaDone=false; return render(); }
  if(a==="psy"){ S.psy[el.dataset.i]=+el.dataset.v; return render(); }
  if(a==="psyDone"){ S.psyDone=true; return go("profile"); }
  if(a==="loginTab"){ S.loginTab = el.dataset.tab; return render(); }
  if(a==="fillKey"){
    const ki = document.getElementById("keyInput");
    const ni = document.getElementById("nameInput");
    if(ki) ki.value = el.dataset.key;
    if(ni && el.dataset.name) ni.value = el.dataset.name;
    return;
  }
  if(a==="fillStaff"){
    const li = document.getElementById("loginInput");
    const pi = document.getElementById("passInput");
    if(li) li.value = el.dataset.login;
    if(pi) pi.value = "demo";
    const btn = document.querySelector("button[data-act='loginStaff']");
    if(btn) btn.click();
    return;
  }
  if(a==="loginStaff"){
    const lg = (document.getElementById("loginInput").value||"").trim().toLowerCase();
    const pw = (document.getElementById("passInput").value||"").trim();
    const acc = STAFF.find(x => x.login === lg && x.pass === pw);
    if(!acc){
      document.getElementById("keyErr").innerHTML =
        `<div class="locked">Неверный логин или пароль.</div>`;
      return;
    }
    S.loggedIn = true; S.role = acc.role; S.name = acc.name; S.roleTitle = acc.title;
    return go(OTHER[acc.role][0][0]);
  }
  if(a==="psyReset"){ S.psy={}; S.psyDone=false; return render(); }
  if(a==="exitToggle"){ const k=el.dataset.k; S.exit[k] = !S.exit[k]; return render(); }
  if(a==="pick"){ S.course=el.dataset.c; return go("lesson"); }
  if(a==="mode"){ S.lessonMode=el.dataset.m; return render(); }
  if(a==="hw"){ S.hwSent=true; return render(); }
  if(a==="hwPhoto"){ S.photo=true; return render(); }
  if(a==="attest"){ S.attest[el.dataset.i]=+el.dataset.a; return render(); }
  if(a==="attestDone"){
    S.attestDone=true;
    S.attestScore=getAttest().reduce((n,q,i)=>n+(S.attest[i]===q.right?1:0),0);
    return render();
  }
  if(a==="attestReset"){ S.attest={}; S.attestDone=false; S.attestScore=0; return render(); }
  if(a==="openKid"){ S.psyKid=el.dataset.k; return go("psy_kid"); }
  if(a==="grade"){ S.checked[el.dataset.w]=+el.dataset.g; return render(); }
});


document.addEventListener("submit", e => {
  if(e.target.closest("[data-act='loginForm']")){
    e.preventDefault();
    const b = document.querySelector("button[data-act='loginStaff']")
           || document.querySelector("button[data-act='login']");
    if(b) b.click();
  }
});

document.addEventListener("change", e => {
  const sel = e.target.closest("[data-act='anketaField']");
  if(sel){ S.anketa[sel.dataset.k]=sel.value; render(); }
});



document.documentElement.lang = "ru";
document.getElementById("rail").setAttribute("aria-label","Разделы");
document.getElementById("themeBtn").addEventListener("click", () => {
  S.theme = S.theme === "dark" ? "light" : "dark"; render();
});

render();
</script>
